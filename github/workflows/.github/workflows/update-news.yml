name: Update Poland Energy news feed

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch, translate and merge latest news
        env:
          DATA_PATH: data/signals.json
        run: python scripts/fetch_news.py
      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then echo "No new articles."; exit 0; fi
          git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          echo "::error::Could not push. Settings > Actions > General > Workflow permissions = Read and write."; exit 1
